name: Generate Client

on:
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  generate-client:
    name: Generate and verify the API client
    permissions:
      contents: write # May commit the deterministic client on same-repository PRs.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Fork pull requests get a read-only checkout and a drift check.
      - name: Checkout fork pull request
        if: github.secret_source != 'Actions'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same-repository pull requests can receive the generated commit.
      - name: Checkout same-repository pull request
        if: github.secret_source == 'Actions'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Create CI environment files
        run: bash scripts/ci-create-env-files.sh

      - name: Generate client
        run: bash scripts/generate-client.sh
        env:
          SECRET_KEY: just-for-generating-client
          POSTGRES_PASSWORD: just-for-generating-client
          FIRST_SUPERUSER_PASSWORD: just-for-generating-client

      - name: Stage generated client
        run: |
          git config --local user.email "github-actions@github.com"
          git config --local user.name "github-actions"
          git add frontend/src/client

      - name: Push generated client
        if: github.secret_source == 'Actions'
        env:
          PUSH_TOKEN: ${{ secrets.FULL_STACK_FASTAPI_TEMPLATE_REPO_TOKEN }}
        run: |
          trap 'git config --local --unset-all credential.helper || true' EXIT
          # Keep the token reference literal until Git invokes the helper.
          # shellcheck disable=SC2016
          git config --local credential.helper \
            '!f() { echo username=x-access-token; echo "password=${PUSH_TOKEN}"; }; f'
          git diff --staged --quiet || git commit -m "Autogenerate frontend client"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Check generated-client drift
        if: github.secret_source != 'Actions'
        run: |
          git diff --staged --quiet || (
            echo "Generated client is stale. Run scripts/generate-client.sh and commit the changes."
            exit 1
          )
