name: Test Docker Compose

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  test-docker-compose:
    name: Test the Compose application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create CI environment files
        run: bash scripts/ci-create-env-files.sh

      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d --wait backend frontend adminer
      - name: Test backend readiness
        run: curl --fail http://localhost:8016/api/v1/utils/health/
      - name: Test frontend health
        run: curl --fail http://localhost:5195/health
      - if: always()
        run: docker compose down -v --remove-orphans
