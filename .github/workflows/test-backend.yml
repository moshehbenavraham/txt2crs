# NOTE: This workflow is superseded by quality.yml which runs tests as part of
# the unified quality gate. This file is retained for:
# 1. Manual workflow dispatch for standalone testing
# 2. Backward compatibility with any external integrations
#
# Prefer using quality.yml for CI/CD - it runs both unit and integration tests
# with proper coverage reporting and artifact uploads.

name: Test Backend (Standalone)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-backend:
    name: Test backend with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The suite owns and clears this isolated CI database.
      POSTGRES_DB: app_test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Create CI environment files
        run: bash scripts/ci-create-env-files.sh

      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          COVERAGE_LABEL: Coverage for ${{ github.sha }}
        run: uv run bash scripts/tests-start.sh "${COVERAGE_LABEL}"
        working-directory: backend
      - if: always()
        run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        # Match the measured Phase 00 application baseline. Raising this gate
        # requires adding tests first rather than claiming unmeasured coverage.
        run: uv run coverage report --fail-under=78
        working-directory: backend
