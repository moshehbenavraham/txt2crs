# NOTE: This workflow is superseded by quality.yml which runs tests as part of
# the unified quality gate. This file is retained for:
# 1. Manual workflow dispatch for standalone testing
# 2. Backward compatibility with any external integrations
#
# Prefer using quality.yml for CI/CD - it runs both unit and integration tests
# with proper coverage reporting and artifact uploads.

name: Test Backend (Standalone)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize
  workflow_dispatch:  # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test-backend:
    name: Test backend with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
      - run: docker compose down -v --remove-orphans
      - run: docker compose up -d db mailcatcher
      - name: Migrate DB
        run: uv run bash scripts/prestart.sh
        working-directory: backend
      - name: Run tests
        env:
          COVERAGE_LABEL: Coverage for ${{ github.sha }}
        run: uv run bash scripts/tests-start.sh "${COVERAGE_LABEL}"
        working-directory: backend
      - if: always()
        run: docker compose down -v --remove-orphans
      - name: Store coverage files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
      - name: Coverage report
        # Match the measured Phase 00 application baseline. Raising this gate
        # requires adding tests first rather than claiming unmeasured coverage.
        run: uv run coverage report --fail-under=78
        working-directory: backend
