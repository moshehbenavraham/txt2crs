name: Database Backup

on:
  schedule:
    # Run bi-weekly on 1st and 15th
    - cron: '0 0 1,15 * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to backup'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions: {}

jobs:
  backup-production:
    name: Backup Production Database
    if: github.event_name == 'schedule' || github.event.inputs.environment == 'production'
    runs-on:
      - self-hosted
      - production
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      BACKUP_RETENTION_DAYS: 7
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create backup directory
        run: mkdir -p ./backups

      - name: Run database backup
        run: |
          docker compose exec -T db pg_dump \
            -U "${POSTGRES_USER}" \
            -d "${POSTGRES_DB}" \
            --no-owner \
            --no-acl \
            | gzip > "./backups/${POSTGRES_DB}_$(date +%Y%m%d_%H%M%S).sql.gz"

      - name: Verify backup
        run: |
          BACKUP_FILE="$(
            find ./backups -maxdepth 1 -type f -name "*.sql.gz" \
              -printf "%T@ %p\n" \
              | sort -nr \
              | head -n 1 \
              | cut -d " " -f 2-
          )"
          if [[ -n "${BACKUP_FILE}" && -f "${BACKUP_FILE}" ]]; then
            echo "Backup created: ${BACKUP_FILE}"
            echo "Size: $(du -h "${BACKUP_FILE}" | cut -f1)"
          else
            echo "ERROR: No backup file found"
            exit 1
          fi

      - name: Cleanup old backups
        run: |
          find ./backups -name "*.sql.gz" -type f \
            -mtime +"${BACKUP_RETENTION_DAYS}" -delete || true
          echo "Remaining backups:"
          ls -lah ./backups/*.sql.gz 2>/dev/null || echo "No backups found"

  backup-staging:
    name: Backup Staging Database
    if: github.event.inputs.environment == 'staging'
    runs-on:
      - self-hosted
      - staging
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      BACKUP_RETENTION_DAYS: 3
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Create backup directory
        run: mkdir -p ./backups

      - name: Run database backup
        run: |
          docker compose exec -T db pg_dump \
            -U "${POSTGRES_USER}" \
            -d "${POSTGRES_DB}" \
            --no-owner \
            --no-acl \
            | gzip > "./backups/${POSTGRES_DB}_$(date +%Y%m%d_%H%M%S).sql.gz"

      - name: Verify backup
        run: |
          BACKUP_FILE="$(
            find ./backups -maxdepth 1 -type f -name "*.sql.gz" \
              -printf "%T@ %p\n" \
              | sort -nr \
              | head -n 1 \
              | cut -d " " -f 2-
          )"
          if [[ -n "${BACKUP_FILE}" && -f "${BACKUP_FILE}" ]]; then
            echo "Backup created: ${BACKUP_FILE}"
            echo "Size: $(du -h "${BACKUP_FILE}" | cut -f1)"
          else
            echo "ERROR: No backup file found"
            exit 1
          fi
