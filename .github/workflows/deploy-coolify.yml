name: Deploy via Coolify

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      target:
        description: "Deployment target"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - backend
          - frontend

concurrency:
  group: coolify-deployment
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    # Do not deploy in the template repository
    if: github.repository_owner != 'fastapi'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'staging' }}
    timeout-minutes: 15
    permissions: {}
    env:
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      COOLIFY_API_URL: ${{ secrets.COOLIFY_API_URL }}
      BACKEND_APP_UUID: ${{ secrets.BACKEND_APP_UUID }}
      FRONTEND_APP_UUID: ${{ secrets.FRONTEND_APP_UUID }}

    steps:
      - name: Determine deployment targets
        id: targets
        env:
          TARGET: ${{ github.event.inputs.target || 'all' }}
        run: |
          if [[ "$TARGET" == "all" || "$TARGET" == "backend" ]]; then
            echo "deploy_backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_backend=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$TARGET" == "all" || "$TARGET" == "frontend" ]]; then
            echo "deploy_frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy_frontend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy backend
        if: steps.targets.outputs.deploy_backend == 'true'
        run: |
          echo "Triggering backend deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_API_URL}/applications/${BACKEND_APP_UUID}/start?force=false&instant_deploy=true")

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Backend deploy trigger failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Backend deployment triggered successfully"

      - name: Deploy frontend
        if: steps.targets.outputs.deploy_frontend == 'true'
        run: |
          echo "Triggering frontend deployment..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "${COOLIFY_API_URL}/applications/${FRONTEND_APP_UUID}/start?force=false&instant_deploy=true")

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Frontend deploy trigger failed (HTTP $HTTP_CODE)"
            exit 1
          fi
          echo "Frontend deployment triggered successfully"

      - name: Wait for backend
        if: steps.targets.outputs.deploy_backend == 'true'
        run: |
          echo "Polling backend deployment status..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_URL}/applications/${BACKEND_APP_UUID}" \
              | jq -r '.status // "unknown"')

            echo "Attempt $i/30: status=$STATUS"

            if [ "$STATUS" = "running" ]; then
              echo "Backend is running"
              exit 0
            fi

            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "error" ]; then
              echo "::error::Backend deployment failed (status: $STATUS)"
              exit 1
            fi

            sleep 10
          done

          echo "::warning::Backend deployment timed out - check Coolify dashboard"
          exit 1

      - name: Wait for frontend
        if: steps.targets.outputs.deploy_frontend == 'true'
        run: |
          echo "Polling frontend deployment status..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_API_URL}/applications/${FRONTEND_APP_UUID}" \
              | jq -r '.status // "unknown"')

            echo "Attempt $i/30: status=$STATUS"

            if [ "$STATUS" = "running" ]; then
              echo "Frontend is running"
              exit 0
            fi

            if [ "$STATUS" = "exited" ] || [ "$STATUS" = "error" ]; then
              echo "::error::Frontend deployment failed (status: $STATUS)"
              exit 1
            fi

            sleep 10
          done

          echo "::warning::Frontend deployment timed out - check Coolify dashboard"
          exit 1
