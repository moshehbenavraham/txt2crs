name: Code Quality

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types:
      - opened
      - synchronize

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # ============================================
  # LINTING JOBS (run in parallel, no dependencies)
  # ============================================

  lint-backend:
    name: Backend Lint (ruff + mypy + ty)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Run lint (ruff check + ruff format --check + mypy + ty)
        run: uv run bash scripts/lint.sh
        working-directory: backend

  validate-engine:
    name: Engine Lint, Types, and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true

      # Run from the engine directory so its own strict Ruff, mypy, and pytest
      # configuration applies instead of the backend shell's exclusions.
      - name: Validate reusable txt2crs engine
        working-directory: backend/packages/txt2crs
        run: |
          uv run --package txt2crs ruff check .
          uv run --package txt2crs mypy
          uv run --package txt2crs pytest -q

  lint-frontend:
    name: Frontend Lint (biome)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Biome CI
        run: npx @biomejs/biome ci --no-errors-on-unmatched --files-ignore-unknown=true ./
        working-directory: frontend

  typecheck-frontend:
    name: Frontend TypeScript (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

  # ============================================
  # TESTING JOBS
  # ============================================

  test-backend-unit:
    name: Backend Unit Tests (Hypothesis)
    runs-on: ubuntu-latest
    needs: lint-backend  # Run after lint passes to catch syntax errors early
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        working-directory: backend

      - name: Create CI environment files
        run: bash scripts/ci-create-env-files.sh

      - name: Run unit tests (models only, no DB required)
        env:
          # Minimal config required for app imports (settings validation).
          # These override the CI .env so the job stays self-describing.
          ENVIRONMENT: "local"
          PROJECT_NAME: "Test Project"
          POSTGRES_SERVER: "localhost"
          POSTGRES_USER: "test"
          FIRST_SUPERUSER: "test@test.com"
          FIRST_SUPERUSER_PASSWORD: "testpassword123"
        run: |
          uv run pytest tests/models/ \
            -v \
            --tb=short \
            -m "hypothesis or not integration" \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml
        working-directory: backend

      - name: Upload unit test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-unit
          path: backend/coverage-unit.xml
          retention-days: 7

  test-backend-integration:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    needs: lint-backend  # Run after lint passes
    timeout-minutes: 30
    env:
      # The suite owns and clears this isolated CI database.
      POSTGRES_DB: app_test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        working-directory: backend

      - name: Create CI environment files
        run: bash scripts/ci-create-env-files.sh

      # Start required services
      - name: Stop any existing containers
        run: docker compose down -v --remove-orphans

      - name: Start database and mail services
        run: docker compose up -d db mailcatcher

      - name: Wait for services to be ready
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 30 bash -c 'until docker compose exec -T db pg_isready; do sleep 1; done'
          echo "PostgreSQL is ready!"

      - name: Run database migrations
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run integration tests with coverage
        run: |
          uv run coverage run -m pytest tests/ \
            --ignore=tests/models/ \
            -v \
            --tb=short \
            -m "not hypothesis"
          # Phase 00 measured 78% for this exact integration suite. Keep the
          # threshold at that honest baseline so future changes cannot regress.
          uv run coverage report --fail-under=78
          uv run coverage xml -o coverage-integration.xml
          uv run coverage html --title "Integration Coverage"
        working-directory: backend

      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

      - name: Upload integration test coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-integration
          path: backend/coverage-integration.xml
          retention-days: 7

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 7

  # ============================================
  # QUALITY GATE
  # ============================================

  alls-green-quality:
    name: Quality Gate
    if: always()
    needs:
      - lint-backend
      - validate-engine
      - lint-frontend
      - typecheck-frontend
      - test-backend-unit
      - test-backend-integration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
