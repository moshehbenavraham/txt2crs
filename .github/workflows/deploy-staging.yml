name: Deploy to Staging

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    # Do not deploy in the main repository, only in user projects
    if: github.repository_owner != 'fastapi'
    runs-on:
      - self-hosted
      - staging
    environment: staging
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    env:
      ENVIRONMENT: staging
      DOMAIN: ${{ secrets.DOMAIN_STAGING }}
      STACK_NAME: ${{ secrets.STACK_NAME_STAGING }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      FIRST_SUPERUSER: ${{ secrets.FIRST_SUPERUSER }}
      FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAILS_FROM_EMAIL: ${{ secrets.EMAILS_FROM_EMAIL }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Wait for Code Quality workflow to pass
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo
            const sha = context.sha
            const timeoutMs = 30 * 60 * 1000
            const intervalMs = 15 * 1000
            const deadline = Date.now() + timeoutMs

            while (Date.now() < deadline) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: "quality.yml",
                head_sha: sha,
                per_page: 20,
              })

              const run =
                runs.data.workflow_runs.find((item) => item.event === "push") ??
                runs.data.workflow_runs[0]

              if (run) {
                core.info(`Code Quality status: ${run.status}/${run.conclusion ?? "pending"}`)
                if (run.status === "completed") {
                  if (run.conclusion === "success") {
                    core.info(`Quality gate satisfied by ${run.html_url}`)
                    return
                  }
                  core.setFailed(`Quality gate failed for ${sha}: ${run.conclusion}`)
                  return
                }
              } else {
                core.info("No Code Quality run found yet for this commit; waiting...")
              }

              await new Promise((resolve) => setTimeout(resolve, intervalMs))
            }

            core.setFailed("Timed out waiting for Code Quality workflow to complete successfully.")

      - name: Capture current images for rollback
        id: capture_images
        run: |
          set -euo pipefail
          PROJECT_NAME="${STACK_NAME}"

          BACKEND_CONTAINER_ID="$(docker compose -f docker-compose.yml --project-name "$PROJECT_NAME" ps -q backend || true)"
          FRONTEND_CONTAINER_ID="$(docker compose -f docker-compose.yml --project-name "$PROJECT_NAME" ps -q frontend || true)"

          BACKEND_IMAGE_ID=""
          FRONTEND_IMAGE_ID=""

          if [ -n "$BACKEND_CONTAINER_ID" ]; then
            BACKEND_IMAGE_ID="$(docker inspect --format='{{.Image}}' "$BACKEND_CONTAINER_ID")"
          fi
          if [ -n "$FRONTEND_CONTAINER_ID" ]; then
            FRONTEND_IMAGE_ID="$(docker inspect --format='{{.Image}}' "$FRONTEND_CONTAINER_ID")"
          fi

          echo "backend_image_id=$BACKEND_IMAGE_ID" >> "$GITHUB_OUTPUT"
          echo "frontend_image_id=$FRONTEND_IMAGE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy updated stack
        id: deploy
        continue-on-error: true
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml --project-name "${STACK_NAME}" build
          docker compose -f docker-compose.yml --project-name "${STACK_NAME}" up -d --wait

      - name: Run post-deploy smoke checks
        id: smoke
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          bash scripts/deploy-smoke-check.sh \
            "https://api.${DOMAIN}/api/v1/utils/health-check/" \
            "https://dashboard.${DOMAIN}/"

      - name: Roll back automatically on failed deploy validation
        if: steps.deploy.outcome != 'success' || steps.smoke.outcome != 'success'
        env:
          BACKEND_PREV_IMAGE_ID: ${{ steps.capture_images.outputs.backend_image_id }}
          FRONTEND_PREV_IMAGE_ID: ${{ steps.capture_images.outputs.frontend_image_id }}
        run: |
          set -euo pipefail
          bash scripts/deploy-rollback.sh

      - name: Mark deployment as failed
        if: steps.deploy.outcome != 'success' || steps.smoke.outcome != 'success'
        run: |
          echo "Deployment validation failed and rollback was triggered."
          exit 1
