version: 2

# Keep the Playwright test runner (npm @playwright/test) and the Playwright
# Docker image (frontend/Dockerfile.playwright) on the same version. A
# mismatch makes every e2e shard fail because the runner looks for browser
# builds the image does not ship (see #35). Dependabot's per-ecosystem
# `groups` cannot span npm and docker, so this uses a multi-ecosystem group;
# the regular npm and docker entries below ignore these two dependencies so
# they are only ever bumped together here.
multi-ecosystem-groups:
  playwright:
    schedule:
      interval: weekly
    labels: [dependencies, internal]
    # commit-message is group-only for multi-ecosystem groups; setting it on
    # the member `updates` entries is a Dependabot configuration error.
    commit-message:
      prefix: deps

updates:
  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels: [dependencies, internal]
    groups:
      github-actions:
        patterns:
          - "*"

  # Python uv
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels: [dependencies, internal]
    groups:
      python-packages:
        patterns:
          - "*"

  # npm
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels: [dependencies, internal]
    ignore:
      # Bumped together with the Playwright image (multi-ecosystem group).
      - dependency-name: "@playwright/test"
    groups:
      npm-packages:
        patterns:
          - "*"

  # Docker
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels: [dependencies, internal]
    # The backend pins `requires-python = ">=3.14,<3.15"`, so a 3.15 base image
    # cannot build. Without this rule Dependabot proposes the next minor line
    # (including pre-releases such as 3.15.0b3), which fails review every week.
    # Moving to 3.15 is a deliberate change: lift the constraint in both
    # pyproject.toml files and .python-version first, then drop this ignore.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Bumped together with @playwright/test (multi-ecosystem group).
      - dependency-name: playwright
      - dependency-name: mcr.microsoft.com/playwright
    groups:
      docker-images:
        patterns:
          - "*"

  # Docker Compose
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
    labels: [dependencies, internal]
    groups:
      compose-images:
        patterns:
          - "*"

  # Playwright runner + image, bumped together in one PR
  - package-ecosystem: npm
    directory: /frontend
    cooldown:
      default-days: 7
    patterns: ["@playwright/test"]
    multi-ecosystem-group: playwright

  - package-ecosystem: docker
    directory: /frontend
    cooldown:
      default-days: 7
    patterns: ["playwright", "mcr.microsoft.com/playwright"]
    multi-ecosystem-group: playwright
