services:

  # Local services are available on their ports, but also available on:
  # http://api.localhost.tiangolo.com: backend
  # http://dashboard.localhost.tiangolo.com: frontend
  # etc. To enable it, update .env, set:
  # DOMAIN=localhost.tiangolo.com
  proxy:
    image: traefik:v3.7.10
    # Note: Docker provider disabled for local dev due to API version incompatibility
    # Services are accessed directly through the registered txt2crs host ports.
    volumes:
      # Docker socket not mounted - provider disabled
      - /dev/null:/var/run/docker.sock:ro
    ports:
      - "${TRAEFIK_HTTP_PORT?Variable not set}:80"
      - "${TRAEFIK_DASHBOARD_PORT?Variable not set}:8080"
    command:
      # Disable Docker provider for local development (API version compatibility issue)
      # - --providers.docker
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Create an entrypoint "https" listening on port 443
      - --entrypoints.https.address=:443
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log
      # Use INFO level for local development (DEBUG is too verbose)
      - --log.level=INFO
      # Enable the Dashboard and API
      - --api
      # Enable the Dashboard and API in insecure mode for local development
      - --api.insecure=true
    labels:
      # Enable Traefik for this service, to make it available in the public network
      - traefik.enable=true
      - traefik.constraint-label=traefik-public
      # Dummy https-redirect middleware that doesn't really redirect, only to
      # allow running it locally
      - traefik.http.middlewares.https-redirect.contenttype.autodetect=false
    networks:
      - traefik-public
      - default

  db:
    restart: "no"
    ports:
      - "${POSTGRES_PORT?Variable not set}:5432"

  adminer:
    image: adminer:5.5.1
    restart: "no"
    networks:
      - traefik-public
      - default
    depends_on:
      - db
    environment:
      - ADMINER_DESIGN=pepa-linha-dark
    ports:
      - "${ADMINER_PORT?Variable not set}:8080"

  prestart:
    environment:
      POSTGRES_PORT: "5432"

  backend:
    restart: "no"
    ports:
      - "${BACKEND_PORT?Variable not set}:8000"
    build:
      context: ./backend
    # The development image already declares USER appuser. Keeping the user
    # out of this override preserves the same non-root identity as production.
    # command: sleep infinity  # Infinite loop to keep container alive doing nothing
    command:
      - fastapi
      - run
      - "app/main.py"
    develop:
      watch:
        - path: ./backend
          action: sync
          target: /app
          ignore:
            - ./backend/.venv
            - .venv
        - path: ./backend/pyproject.toml
          action: rebuild
    volumes:
      # Static repository-contract tests inspect these authored, non-secret
      # files. Mount only their inputs instead of the whole checkout so the
      # development API cannot read `.env`, `.git`, or unrelated host files.
      - ./docker-compose.yml:/workspace/docker-compose.yml:ro
      - ./docker-compose.override.yml:/workspace/docker-compose.override.yml:ro
      - ./.env.example:/workspace/.env.example:ro
      - ./backend/.env.example:/workspace/backend/.env.example:ro
      - ./frontend/.env.example:/workspace/frontend/.env.example:ro
      - ./.gitleaksignore:/workspace/.gitleaksignore:ro
      - ./.github/workflows:/workspace/.github/workflows:ro
      - ./scripts:/workspace/scripts:ro
      - ./backend/Dockerfile:/workspace/backend/Dockerfile:ro
      - ./backend/scripts:/workspace/backend/scripts:ro
    environment:
      POSTGRES_PORT: "5432"
      SMTP_HOST: "mailcatcher"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
      # OpenTelemetry Configuration
      # Set OTEL_ENABLED=true to enable distributed tracing
      # Traces viewable at the JAEGER_UI_PORT declared in the root .env.
      OTEL_ENABLED: "${OTEL_ENABLED:-false}"
      OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: "${PROJECT_NAME:-txt2crs}"
      # Test-only user creation endpoint; config rejects this outside local mode.
      ENABLE_PRIVATE_DEV_ROUTES: "true"
      # Tests use this explicit path only for the read-only mounts above.
      TXT2CRS_REPOSITORY_ROOT: "/workspace"

  mailcatcher:
    image: sj26/mailcatcher:v0.10.0
    ports:
      - "${MAILCATCHER_WEB_PORT?Variable not set}:1080"
      - "${MAILCATCHER_SMTP_PORT?Variable not set}:1025"

  # Jaeger for OpenTelemetry trace visualization
  # Host mappings come from the registered values in the root .env.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    restart: "no"
    ports:
      - "${JAEGER_UI_PORT?Variable not set}:16686"
      - "${OTLP_GRPC_PORT?Variable not set}:4317"
      - "${OTLP_HTTP_PORT?Variable not set}:4318"
    environment:
      - COLLECTOR_OTLP_GRPC_HOST_PORT=0.0.0.0:4317
      - COLLECTOR_OTLP_HTTP_HOST_PORT=0.0.0.0:4318

  frontend:
    restart: "no"
    ports:
      - "${FRONTEND_PORT?Variable not set}:80"
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:${BACKEND_PORT?Variable not set}
        - VITE_ENABLE_PUBLIC_SIGNUP=${ENABLE_PUBLIC_SIGNUP:-false}
        - VITE_HTML_PREVIEW_MAX_BYTES=${TXT2CRS_HTML_PREVIEW_MAX_BYTES:-5242880}
        - NODE_ENV=development

  playwright:
    # Playwright is a one-shot test runner, not a long-running application
    # service. Explicit `docker compose run playwright ...` commands still
    # enable this profile automatically, while ordinary `up --wait` excludes
    # the successful exit that Compose would otherwise report as a failure.
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.playwright
      args:
        - VITE_API_URL=http://backend:8000
        - VITE_ENABLE_PUBLIC_SIGNUP=${ENABLE_PUBLIC_SIGNUP:-false}
        - VITE_HTML_PREVIEW_MAX_BYTES=${TXT2CRS_HTML_PREVIEW_MAX_BYTES:-5242880}
        - NODE_ENV=production
    ipc: host
    depends_on:
      - backend
      - mailcatcher
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://backend:8000
      - VITE_ENABLE_PUBLIC_SIGNUP=${ENABLE_PUBLIC_SIGNUP:-false}
      - VITE_HTML_PREVIEW_MAX_BYTES=${TXT2CRS_HTML_PREVIEW_MAX_BYTES:-5242880}
      - MAILCATCHER_HOST=http://mailcatcher:1080
      # For the reports when run locally
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./frontend/blob-report:/app/blob-report
      - ./frontend/test-results:/app/test-results
    ports:
      - "${PLAYWRIGHT_REPORT_PORT?Variable not set}:9323"

networks:
  traefik-public:
    # For local dev, don't expect an external Traefik network
    external: false
